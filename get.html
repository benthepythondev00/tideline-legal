<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tideline: Period &amp; PMS tracker for iPhone</title>
<meta name="description" content="Track your period, see the next one coming, and write one sentence a day about the week before it. For iPhone.">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="style.css">
<style>
.get { text-align:center; }
.get .icon { width:88px; height:88px; border-radius:20px; box-shadow:0 8px 22px rgba(145,53,92,.18); }
.get h1 { margin-top:.9rem; }
.get .store { display:inline-block; margin:1rem 0 .2rem; }
.get .store img { height:58px; display:block; }
.get .shot { width:min(100%, 300px); border-radius:26px; margin:1.4rem auto 0; display:block; box-shadow:0 14px 34px rgba(145,53,92,.16); }
</style>
</head>
<body><main>
<article class="get">
<img class="icon" src="icon.png" alt="">
<h1>Tideline<br><em>Period &amp; PMS tracker</em></h1>
<p>Track your period, see the next one coming, and write one sentence a day about the week before it.</p>
<a class="store" id="store" href="https://apps.apple.com/app/apple-store/id6814561188?pt=129315704&amp;ct=site&amp;mt=8"><img src="https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/en-us?size=250x83" alt="Download on the App Store"></a>
<p class="date">Free to track. No account. For iPhone.</p>
<img class="shot" src="today.jpg" alt="Tideline showing the days until your period and until ovulation">
</article>
<p class="foot"><a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a> · <a href="support.html">Support</a><br>© 2026 Ben Jonas Goedeke</p>
</main>
<script>
// The ad that sent her here names itself in ?c=, and Apple's campaign link carries that on, so its downloads can be told apart.
const store = document.getElementById('store');
const c = new URLSearchParams(location.search).get('c');
if (/^[a-z0-9]{1,20}$/.test(c ?? '')) store.href = store.href.replace('ct=site', 'ct=' + c);
// On an iPhone the App Store is where she is headed, so she is taken there at once. Once per visit: when she comes
// back, or if the App Store did not open, this page with its button is what she finds.
if (/iPhone|iPod/.test(navigator.userAgent) && !sessionStorage.getItem('sent')) { sessionStorage.setItem('sent', '1'); location.href = store.href; }
</script>
</body>
</html>
